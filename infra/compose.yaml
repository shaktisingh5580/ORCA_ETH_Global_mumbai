# Purpose: run the live P02 PostGIS and S3-compatible services for gate verification.
# Behavior: expose only loopback ports; require caller-supplied development credentials.
# Refs: main implementation plan P02.1/P02.5; docs/04_database.md; Phase: P02.
name: orca-p02
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: orca_test
      POSTGRES_USER: orca_migrator
      POSTGRES_PASSWORD: ${ORCA_DB_PASSWORD:?set ORCA_DB_PASSWORD}
      ORCA_RUNTIME_PASSWORD: ${ORCA_RUNTIME_PASSWORD:?set ORCA_RUNTIME_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - orca_postgres:/var/lib/postgresql/data
      - ./postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca_migrator -d orca_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${ORCA_S3_ACCESS_KEY:?set ORCA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORCA_S3_SECRET_KEY:?set ORCA_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - orca_objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  orca_postgres:
  orca_objects:
