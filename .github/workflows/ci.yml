# Purpose: reproduce P00/P01 checks on a clean Linux worker.
# Behavior: acquire locked Python/Arkiv dependencies and verify committed code; local source docs stay private.
# Refs: main_implementation plan.md P01.4; H04-agent-coordination.json; Phase: P01/H04.
name: Backend phase gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: arkiv
      - run: npm run check
        working-directory: arkiv
      # Offline ENS safety tests do not claim live namespace/delegation acceptance.
      - run: npm test
        working-directory: arkiv
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.30'
      - run: uv python install 3.12.12
      - run: uv sync --project backend --locked
      - run: uv build --project backend --out-dir backend/dist
      # Full G00/G01 also checks local research references intentionally excluded from Git.
      - run: backend/.venv/bin/python backend/scripts/export_openapi.py --check
      - run: backend/.venv/bin/python backend/scripts/export_prototype_contract.py --check
      - run: backend/.venv/bin/python backend/scripts/check_file_headers.py
      - run: backend/.venv/bin/python backend/scripts/check_import_boundaries.py
      - run: backend/.venv/bin/python -m ruff check backend
      - run: backend/.venv/bin/python -m ruff format --check backend
      - run: backend/.venv/bin/python -m mypy --config-file backend/pyproject.toml backend/src backend/scripts
      - run: backend/.venv/bin/python -m pytest -c backend/pyproject.toml backend/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-gate-evidence
          path: docs/gates/
